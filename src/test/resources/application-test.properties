spring.application.name=xpository-test

# Use in-memory database for tests
spring.datasource.url=jdbc:sqlite::memory:
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Hibernate Search - use in-memory for tests
spring.jpa.properties.hibernate.search.backend.type=lucene
spring.jpa.properties.hibernate.search.backend.directory.type=local-heap
spring.jpa.properties.hibernate.search.backend.analysis.configurer=net.ottleys.xpository.config.XpositoryLuceneAnalysisConfigurer

# Element Type Configuration
xpository.element-types.max-file-size=1048576
xpository.element-types.locations[0]=classpath:element-types/*.json
xpository.element-types.locations[1]=classpath:element-types/custom/*.json

# Collection Configuration
xpository.collections.list.max-depth=10
xpository.collections.tree.max-depth=20
xpository.collections.soft-delete.retention-days=30
xpository.collections.soft-delete.auto-cleanup-enabled=false

# Spring JPA Open in View - Disabled for best practices
spring.jpa.open-in-view=false

# DevTools - Disabled in tests
spring.devtools.restart.enabled=false
