# Production Profile Configuration
# Activate with: -Dspring.profiles.active=prod or SPRING_PROFILES_ACTIVE=prod

# Application Name
spring.application.name=xpository

# Server Configuration - Production
server.port=${SERVER_PORT:8080}

# Database Configuration - Production (file-based SQLite)
# For production, consider PostgreSQL or other production-grade database
spring.datasource.url=jdbc:sqlite:${DATABASE_PATH:./target/xpository.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# Hibernate DDL - NEVER use update/create in production
# Manage schema migrations with Flyway or Liquibase
spring.jpa.hibernate.ddl-auto=create

# Show SQL - DISABLED in production
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Hibernate Search Configuration - Production
xpository.search.reindex-on-startup=false
spring.jpa.properties.hibernate.search.backend.type=lucene
spring.jpa.properties.hibernate.search.backend.directory.root=${INDEX_PATH:./target/indexes}
spring.jpa.properties.hibernate.search.backend.analysis.configurer=net.ottleys.xpository.config.XpositoryLuceneAnalysisConfigurer
# Default query limit for Hibernate Search (uncomment to enable)
#spring.jpa.properties.hibernate.search.backend.query.default-limit=200

# System Root Collection Type (e.g., LIST, TREE, or GRAPH)
xpository.collection.systemRoot.type=LIST

# Element Type Configuration
xpository.element-types.max-file-size=1048576
xpository.element-types.locations[0]=file:${CONFIG_PATH:/etc/xpository}/element-types/*.json
xpository.element-types.locations[1]=classpath:element-types/*.json

# Collection Configuration
xpository.collections.list.max-depth=10
xpository.collections.tree.max-depth=20
xpository.collections.soft-delete.retention-days=30
xpository.collections.soft-delete.auto-cleanup-enabled=true

# JWT Configuration
xpository.jwt.secret=<YOUR_PRODUCTION_JWT_SECRET>
xpository.jwt.expiration-ms=3600000

# Bucket4j Configuration - Production
bucket4j.enabled=false

# Spring JPA Open in View - Disabled for best practices
spring.jpa.open-in-view=false

# Security - Production
# Implement proper authentication and authorization

# Logging Configuration
logging.level.root=INFO
logging.level.net.ottleys.xpository=INFO
logging.file.name=${LOG_PATH:./target}/xpository.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Actuator - Production health checks (requires spring-boot-starter-actuator dependency)
# Uncomment when actuator is added:
# management.endpoints.web.exposure.include=health,info,metrics
# management.endpoint.health.show-details=when-authorized

# DevTools - DISABLED in production
spring.devtools.restart.enabled=false
