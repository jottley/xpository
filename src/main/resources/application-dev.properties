# Development Profile Configuration
# Activate with: -Dspring.profiles.active=dev or SPRING_PROFILES_ACTIVE=dev

# Application Name
spring.application.name=xpository

# Server Configuration
server.port=8080

# Database Configuration - Development (file-based SQLite)
spring.datasource.url=jdbc:sqlite:xpository-dev.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# Hibernate DDL - Create/update schema automatically in dev
spring.jpa.hibernate.ddl-auto=update

# Show SQL - Enabled for debugging in dev
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Hibernate Search Configuration - Development
xpository.search.reindex-on-startup=false
spring.jpa.properties.hibernate.search.backend.type=lucene
#spring.jpa.properties.hibernate.search.backend.directory.root=data/indexes-dev
# Store Lucene indexes in RAM per ApplicationContext instead of on disk
spring.jpa.properties.hibernate.search.backend.directory.type=local-heap
spring.jpa.properties.hibernate.search.backend.analysis.configurer=net.ottleys.xpository.config.XpositoryLuceneAnalysisConfigurer

# System Root Collection Type (e.g., LIST, TREE, or GRAPH)
xpository.collection.systemRoot.type=LIST

# Element Type Configuration
xpository.element-types.max-file-size=1048576
xpository.element-types.locations[0]=classpath:element-types/*.json
xpository.element-types.locations[1]=classpath:element-types/custom/*.json

# Collection Configuration
xpository.collections.list.max-depth=10
xpository.collections.tree.max-depth=20
xpository.collections.soft-delete.retention-days=30
xpository.collections.soft-delete.auto-cleanup-enabled=true

# JWT Configuration
# Do not use this secret in production, only for development purposes
xpository.jwt.secret=C8QaCX/In45CFmkjZaGPpzHXe2x1teEAXSHSb31RDxQ=
xpository.jwt.expiration-ms=3600000

# Bucket4j Configuration - Development
bucket4j.enabled=false


# Spring JPA Open in View - Disabled for best practices
spring.jpa.open-in-view=false

# Security - Development (permit all for testing)
# Production security will require authentication

# DevTools - Enable hot reload
spring.devtools.restart.enabled=true
